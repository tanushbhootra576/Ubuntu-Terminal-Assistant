[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "term-assistant"
version = "0.1.0"
description = "Python-powered Ubuntu terminal assistant for WSL/Linux with suggestions, plugins, and productivity tools"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "prompt_toolkit>=3.0.43",
  "PyYAML>=6.0.1",
  "colorama>=0.4.6",
  # Gemini (new client) for Chat Mode
  "google-genai>=0.1.0",
]

[project.scripts]
ta = "term_assistant.__main__:main"
tasnippet = "term_assistant.cli_snippet:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
